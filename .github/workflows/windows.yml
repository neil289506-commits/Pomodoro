name: windows

on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            msvc_arch: x64
            qt_target_arch: win64_msvc2022_64
            qt_target_dir: msvc2022_64
          - name: windows-arm64
            msvc_arch: amd64_arm64
            qt_target_arch: win64_msvc2022_arm64_cross_compiled
            qt_target_dir: msvc2022_arm64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt host (x64 tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ github.workspace }}\qt-host
          modules: qtspeech qtmultimedia
          cache: true
          set-env: false

      - name: Install Qt ARM64 target
        if: matrix.qt_target_arch == 'win64_msvc2022_arm64_cross_compiled'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_arm64_cross_compiled
          dir: ${{ github.workspace }}\qt-target
          modules: qtspeech qtmultimedia
          cache: true
          set-env: false

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          # 失敗時把 CMake 的錯誤訊息輸出成註解（完整記錄需要登入才能看）
          exec > >(tee configure.log) 2>&1
          trap 'sleep 1; grep -E -B1 -A7 "CMake Error" configure.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:380}"; done' ERR
          BUILD_DIR="build-${{ matrix.name }}"
          HOST="${{ github.workspace }}/qt-host/Qt/6.8.3/msvc2022_64"
          if [ "${{ matrix.qt_target_arch }}" = "win64_msvc2022_64" ]; then
            cmake -S windows -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPOMO_REQUIRE_TTS=ON \
              -DCMAKE_PREFIX_PATH="$HOST"
          else
            TARGET="${{ github.workspace }}/qt-target/Qt/6.8.3/${{ matrix.qt_target_dir }}"
            cmake -S windows -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPOMO_REQUIRE_TTS=ON \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
              -DCMAKE_PREFIX_PATH="$TARGET" \
              -DQT_HOST_PATH="$HOST"
          fi

      - name: Build
        shell: bash
        run: cmake --build "build-${{ matrix.name }}" --config Release

      - name: Deploy Qt runtime
        if: matrix.qt_target_arch == 'win64_msvc2022_64'
        shell: bash
        run: |
          set -euxo pipefail
          HOST="${{ github.workspace }}/qt-host/Qt/6.8.3/msvc2022_64"
          "$HOST/bin/windeployqt.exe" "build-${{ matrix.name }}/pomodoro.exe"

      - name: 打包 zip
        shell: bash
        run: |
          B="build-${{ matrix.name }}"
          mkdir -p stage && cp "$B/pomodoro.exe" stage/
          cp "$B"/*.dll stage/ 2>/dev/null || true
          for d in plugins platforms styles imageformats iconengines generic networkinformation tls texttospeech multimedia; do
            [ -d "$B/$d" ] && cp -R "$B/$d" stage/ || true
          done
          python .github/scripts/package.py "dist/TomatoGuard-${{ matrix.name }}-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.name }}
          path: dist/*.zip
