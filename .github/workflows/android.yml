name: android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write   # 讓 CI 能把產物提交到 compile/
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
        working-directory: android
      # 純 Kotlin，沒有原生程式碼：同一個 APK 同時支援 ARM（arm64-v8a / armeabi-v7a）與 AMD64（x86_64 / x86）
      - uses: actions/upload-artifact@v4
        with: { name: Android_AMD64_and_Arm, path: android/app/build/outputs/apk/debug/*.apk }

      - name: 保存編譯產物到 compile/（僅 main 的 push）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: bash .github/scripts/save-compile.sh "android" android/app/build/outputs/apk/debug/*.apk
