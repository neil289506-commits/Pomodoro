name: android
on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
        working-directory: android
      # 純 Kotlin，沒有原生程式碼：同一個 APK 同時支援 ARM（arm64-v8a / armeabi-v7a）與 AMD64（x86_64 / x86）
      - name: 打包 zip
        shell: bash
        run: |
          mkdir -p stage && cp android/app/build/outputs/apk/debug/*.apk stage/
          python3 .github/scripts/package.py "dist/TomatoGuard-android-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-android
          path: dist/*.zip
