name: ios

on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

# ios/ 是 po-gl/pomodoro（GPL-3.0）的原始碼快照，用 Xcode 編譯，出處見 ios/UPSTREAM.md
jobs:
  build:
    name: Build unsigned iOS IPA (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/Pomodoro.xcodeproj
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create placeholder Shared/Env.plist
        # 專案的 Resources 會打包 Shared/Env.plist（路徑由 Xcode 的 Shared 群組決定，不是 ios/Env.plist）。
        # 上游把它放在 .gitignore（內容是作者自己的即時動態伺服器網址），缺檔時 xcodebuild 會失敗。
        # 這裡放上游程式碼缺檔時的預設值，側載版本不會連到任何伺服器。
        shell: bash
        run: |
          cat > ios/Shared/Env.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>serverURL</key><string>http://127.0.0.1:9000</string>
          </dict></plist>
          PLIST
          plutil -lint ios/Shared/Env.plist

      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Pomodoro.xcodeproj -scheme Pomodoro

      - name: Archive iOS app without signing
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee "$RUNNER_TEMP/xcodebuild.log") 2>&1
          trap 'sleep 1; msg=$(grep -E "error:|\*\* ARCHIVE FAILED|fatal|Unable to find|requires a development team|Build input file" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -n 8 | cut -c1-260); msg="${msg//$'"'"'\n'"'"'/%0A}"; echo "::error::xcodebuild 失敗：%0A${msg}"' ERR
          xcodebuild archive \
            -project Pomodoro.xcodeproj -scheme Pomodoro -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Pomodoro.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Check and normalize Info.plist
        shell: bash
        run: |
          APP="$RUNNER_TEMP/Pomodoro.xcarchive/Products/Applications/Pomodoro.app"
          [ -d "$APP" ] || { echo "::error::archive 裡找不到 Pomodoro.app"; find "$RUNNER_TEMP/Pomodoro.xcarchive/Products" -maxdepth 4 | head -20; exit 1; }
          python3 .github/scripts/check_ios_app.py "$APP"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Pomodoro.xcarchive/Products/Applications/Pomodoro.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" stage
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/Pomodoro.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/stage/Pomodoro-unsigned.ipa" Payload)
          ls -lh stage/Pomodoro-unsigned.ipa
          python3 .github/scripts/package.py "dist/PoGl-Pomodoro-ios-arm64-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-ios-arm64
          path: dist/*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
