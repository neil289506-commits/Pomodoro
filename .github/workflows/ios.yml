name: ios
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '7.6.4' }
      # arm64、iPhone + iPad（UIDeviceFamily 1,2）。簽署與 .ipa 需 Apple 憑證，目前只做編譯
      - name: Gradle build
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log || { grep -E -A2 "What went wrong|error:|Could not|Caused by|FAILED" build.log | head -20 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; exit 1; }
