

name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -list -project Pomodoro.xcodeproj
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create CI Env.plist if required
        shell: bash
        run: |
          if [ ! -f Env.plist ]; then
            cat > Env.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro

      - name: Archive iOS app without signing
        shell: bash
        run: |
          set -o pipefail

          xcodebuild archive \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pomodoro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/Pomodoro.xcarchive"
          APP="$ARCHIVE/Products/Applications/Pomodoro.app"
          OUTPUT="$GITHUB_WORKSPACE/output"
          PAYLOAD="$RUNNER_TEMP/ipa/Payload"

          if [ ! -d "$APP" ]; then
            echo "::error::Pomodoro.app was not found in the archive."
            echo "Archive contents:"
            find "$ARCHIVE/Products" -maxdepth 5 -print || true
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist"

          mkdir -p "$PAYLOAD" "$OUTPUT"
          cp -R "$APP" "$PAYLOAD/Pomodoro.app"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$OUTPUT/Pomodoro-unsigned.ipa" Payload

          echo "IPA created:"
          ls -lh "$OUTPUT/Pomodoro-unsigned.ipa"

      - name: Collect build log
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            cp "$RUNNER_TEMP/xcodebuild.log" \
              "$GITHUB_WORKSPACE/output/xcodebuild.log"
          fi

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-iOS-unsigned-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
