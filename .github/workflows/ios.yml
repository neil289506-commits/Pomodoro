name: iOS Unsigned Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_number:
        description: "Optional release number used in the ZIP filename"
        required: false
        default: "dev"
        type: string
  workflow_call:
    inputs:
      release_number:
        description: "Optional release number used in the ZIP filename"
        required: false
        default: "dev"
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Prepare environment plist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/Shared
          cat > ios/Shared/Env.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>serverURL</key>
              <string>http://localhost:9000</string>
          </dict>
          </plist>
          PLIST
          plutil -lint ios/Shared/Env.plist

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/Pomodoro.xcodeproj \
            -scheme Pomodoro

      - name: Archive unsigned app
        shell: bash
        run: |
          set -o pipefail
          ARCHIVE="$RUNNER_TEMP/Pomodoro.xcarchive"
          LOG="$RUNNER_TEMP/ios-xcodebuild.log"

          set +e
          xcodebuild archive \
            -project ios/Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::xcodebuild archive failed with exit code $STATUS"
            exit "$STATUS"
          fi

      - name: Check archived app
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/Pomodoro.xcarchive/Products/Applications/Pomodoro.app"
          echo "Checking app: $APP"

          if [[ ! -d "$APP" ]]; then
            echo "::error::Archived app not found: $APP"
            exit 1
          fi

          INFO_PLIST="$APP/Info.plist"
          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::Info.plist not found"
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST")

          if [[ -z "$BUNDLE_ID" || -z "$EXECUTABLE" || -z "$VERSION" ]]; then
            echo "::error::Required app metadata is missing"
            exit 1
          fi

          if [[ ! -f "$APP/$EXECUTABLE" ]]; then
            echo "::error::App executable not found: $EXECUTABLE"
            exit 1
          fi

          echo "Bundle ID: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"
          echo "Build version: $VERSION"
          echo "App validation passed."

      - name: Package unsigned IPA and ZIP
        shell: bash
        env:
          RELEASE_NUMBER: ${{ inputs.release_number || 'dev' }}
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/Pomodoro.xcarchive/Products/Applications/Pomodoro.app"
          STAGE="$RUNNER_TEMP/ios-stage"
          DIST="$RUNNER_TEMP/ios-dist"

          rm -rf "$STAGE" "$DIST"
          mkdir -p "$STAGE/Payload" "$DIST"

          ditto "$APP" "$STAGE/Payload/Pomodoro.app"
          (
            cd "$STAGE"
            /usr/bin/zip -qry "$DIST/Pomodoro-unsigned.ipa" Payload
          )

          cp "$DIST/Pomodoro-unsigned.ipa" "$STAGE/Pomodoro-unsigned.ipa"
          ZIP_NAME="PoGl-Pomodoro-ios-arm64-CP${RELEASE_NUMBER}.zip"
          /usr/bin/zip -qry "$DIST/$ZIP_NAME" "$STAGE"

          echo "IPA: $DIST/Pomodoro-unsigned.ipa"
          echo "ZIP: $DIST/$ZIP_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-unsigned-ipa
          path: ${{ runner.temp }}/ios-dist/Pomodoro-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: zip-ios-arm64
          path: ${{ runner.temp }}/ios-dist/PoGl-Pomodoro-ios-arm64-CP*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/ios-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
