name: ios

on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

# ios/ 是 po-gl/pomodoro（GPL-3.0）的原始碼快照，出處見 ios/UPSTREAM.md
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 編譯未簽署的 IPA
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          trap 'sleep 1; msg=$(grep -E "error:|\*\* ARCHIVE FAILED|fatal|Unable to find|requires a development team" build.log | head -n 12 | cut -c1-220); msg="${msg//$'"'"'\n'"'"'/%0A}"; echo "::error::xcodebuild 失敗：%0A${msg}"' ERR
          xcodebuild -version
          xcodebuild archive \
            -project Pomodoro.xcodeproj -scheme Pomodoro -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/Pomodoro.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
          mkdir -p build/ipa/Payload
          cp -R build/Pomodoro.xcarchive/Products/Applications/*.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Pomodoro-unsigned.ipa Payload)
          ls -la build/Pomodoro-unsigned.ipa

      - name: 打包 zip
        shell: bash
        run: |
          mkdir -p stage && cp ios/build/Pomodoro-unsigned.ipa stage/
          python3 .github/scripts/package.py "dist/PoGl-Pomodoro-ios-arm64-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-ios-arm64
          path: dist/*.zip
