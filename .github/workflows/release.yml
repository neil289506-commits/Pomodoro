name: release

# 推送到 main：編譯五個平台 → 各自打包成 zip → 發佈 GitHub Release
#   Tag：CP#<次數>　　Release 名稱：CP#<日期時間>+<次數>　　標示為 Pre-release
# 手動執行（workflow_dispatch）在非 main 分支時只會編譯打包，zip 放在 release-preview artifact，不發佈 Release。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.n.outputs.number }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 次數 = 已存在的 CP#<數字> tag 中最大的數字 + 1
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' | sed -n 's/^CP#\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          echo "number=$(( ${LAST:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    uses: ./.github/workflows/android.yml
    secrets: inherit   # 簽署金鑰（有設定才會用）
    with:
      release_number: ${{ needs.prepare.outputs.number }}

  ios:
    needs: prepare
    uses: ./.github/workflows/ios.yml
    with:
      release_number: ${{ needs.prepare.outputs.number }}

  linux:
    needs: prepare
    uses: ./.github/workflows/linux.yml
    with:
      release_number: ${{ needs.prepare.outputs.number }}

  macos:
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      release_number: ${{ needs.prepare.outputs.number }}

  windows:
    needs: prepare
    uses: ./.github/workflows/windows.yml
    with:
      release_number: ${{ needs.prepare.outputs.number }}

  publish:
    needs: [prepare, android, ios, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建立 tag 與 Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true

      - name: 列出要發佈的 zip
        run: ls -la dist

      - name: 發佈 Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # 這個 job 沒有 checkout，gh 需要明確知道 repo
        run: |
          N='${{ needs.prepare.outputs.number }}'
          TAG="CP#${N}"
          NAME="CP#$(TZ=Asia/Taipei date +%Y%m%d-%H%M%S)+${N}"   # 時間為 UTC+8
          {
            echo "第 ${N} 次發佈（commit ${GITHUB_SHA:0:7}）。每個平台各自一個 zip，檔名結尾為 CP${N}。"
            echo
            echo "- Windows：解壓後執行 \`pomodoro.exe\`（x64 與 ARM64 都已內含 Qt 執行庫，不需安裝任何開發工具）。第一次執行若出現 SmartScreen 警告，選「其他資訊 → 仍要執行」"
            echo "- macOS：解壓後把 \`pomodoro.app\` 拖到「應用程式」，已內含 Qt。因為沒有 Apple 開發者簽署與公證，第一次請按右鍵 → 打開，或在終端機執行 \`xattr -cr pomodoro.app\`"
            echo "- Linux：解壓後得到 \`.AppImage\`，執行 \`chmod +x\` 後直接執行，已內含 Qt。若出現 FUSE 錯誤，安裝 libfuse2 或加上 \`--appimage-extract-and-run\`；語音提醒需要系統已安裝 speech-dispatcher"
            echo "- Android：解壓後安裝 APK。這是 [Goodtime](https://github.com/adrcotfas/goodtime)（GPL-3.0）的 F-Droid 風味，原始碼在 \`android/\`。沒有設定簽署金鑰時用 debug 金鑰簽署，每個版本的簽章不同，更新前請先解除安裝舊版；需允許安裝未知來源 App"
            echo "- iOS：解壓後得到**未簽署**的 \`.ipa\`，是 [po-gl/pomodoro](https://github.com/po-gl/pomodoro)（GPL-3.0）的 fork，原始碼在 \`ios/\`。需用 AltStore / Sideloadly 等側載工具以你自己的 Apple ID 簽署（iPhone、iPad）"
            echo
            echo "本專案以 GPL-3.0 授權，手機版為上述兩個 GPL-3.0 專案的 fork，出處與授權見 NOTICE.md。"
          } > notes.md
          if ! gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$NAME" --notes-file notes.md --prerelease 2> err.log; then
            while IFS= read -r l; do echo "::error::${l:0:380}"; done < err.log
            exit 1
          fi

      - name: 預覽（非 main，不發佈）
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: dist/*.zip
