name: macos

on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtspeech qtmultimedia
          cache: true

      - name: Configure
        shell: bash
        run: |
          set -eo pipefail
          # 失敗時把 CMake 的錯誤訊息輸出成註解（完整記錄需要登入才能看）
          exec > >(tee configure.log) 2>&1
          trap 'sleep 1; grep -E -B1 -A7 "CMake Error" configure.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:380}"; done' ERR
          cmake -S macos -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOMO_REQUIRE_TTS=ON -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-macos --config Release 2>&1 | tee build.log || { grep -E "error|undefined|FAILED|ld:" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; exit 1; }

      - name: Check binary architecture
        run: lipo -info build-macos/pomodoro.app/Contents/MacOS/pomodoro

      - name: 把 Qt 一起打包進 .app（使用者不需安裝）
        shell: bash
        run: |
          set -eo pipefail
          APP=build-macos/pomodoro.app
          # 語音外掛不一定會被自動偵測，手動放進去並交給 macdeployqt 處理它的相依
          mkdir -p "$APP/Contents/PlugIns/texttospeech"
          cp "$QT_ROOT_DIR"/plugins/texttospeech/*.dylib "$APP/Contents/PlugIns/texttospeech/"
          args=(); for f in "$APP"/Contents/PlugIns/texttospeech/*.dylib; do args+=("-executable=$f"); done
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" "${args[@]}" -verbose=1
          # Apple Silicon 要求所有程式碼都有簽署：用 ad-hoc 簽署（不是 Apple 開發者簽署，也沒有公證）
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP" && echo "簽署驗證通過"
          lipo -info "$APP/Contents/MacOS/pomodoro"
          du -sh "$APP"

      - name: 打包 zip（.app）
        shell: bash
        run: |
          mkdir -p stage && cp -R build-macos/pomodoro.app stage/
          python3 .github/scripts/package.py "dist/TomatoGuard-macos-universal-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-macos-universal
          path: dist/*.zip
