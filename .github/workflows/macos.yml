name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure
        run: cmake -S macos -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build-macos --config Release

      - name: Check binary architecture
        run: lipo -info build-macos/pomodoro

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build-macos/pomodoro
