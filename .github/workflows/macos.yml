name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 讓 CI 能把產物提交到 compile/
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure
        run: cmake -S macos -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-macos --config Release 2>&1 | tee build.log || { grep -E "error|undefined|FAILED|ld:" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; exit 1; }

      - name: Check binary architecture
        run: lipo -info build-macos/pomodoro

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build-macos/pomodoro

      - name: 保存編譯產物到 compile/（僅 main 的 push）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: bash .github/scripts/save-compile.sh "macos-universal" build-macos/pomodoro
