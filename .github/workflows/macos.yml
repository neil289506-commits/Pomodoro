name: macos

on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtspeech
          cache: true

      - name: Configure
        run: cmake -S macos -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOMO_REQUIRE_TTS=ON -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-macos --config Release 2>&1 | tee build.log || { grep -E "error|undefined|FAILED|ld:" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; exit 1; }

      - name: Check binary architecture
        run: lipo -info build-macos/pomodoro.app/Contents/MacOS/pomodoro

      - name: 打包 zip（.app）
        shell: bash
        run: |
          mkdir -p stage && cp -R build-macos/pomodoro.app stage/
          python3 .github/scripts/package.py "dist/TomatoGuard-macos-universal-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-macos-universal
          path: dist/*.zip
