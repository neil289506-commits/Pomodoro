name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 讓 CI 能把產物提交到 compile/
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - name: linux-arm64
            os: ubuntu-24.04-arm   # Qt 6.8.3 arm64 預編譯套件需要 glibc 2.38+（22.04 只有 2.35）
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ ninja-build cmake pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libpulse-dev libx11-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        run: cmake -S linux -B build-${{ matrix.name }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-${{ matrix.name }} --config Release 2>&1 | tee build.log || { grep -E "error|undefined|FAILED" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; { echo "== moc 診斷"; "$QT_ROOT_DIR/libexec/moc" --version 2>&1 | head -3; ldd "$QT_ROOT_DIR/libexec/moc" 2>&1 | grep -iE "not found" | head -5; grep -iE -B6 "AutoMoc subprocess" build.log | head -14; } 2>&1 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build-${{ matrix.name }}/pomodoro

      - name: 保存編譯產物到 compile/（僅 main 的 push）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: bash .github/scripts/save-compile.sh "${{ matrix.name }}" build-${{ matrix.name }}/pomodoro
