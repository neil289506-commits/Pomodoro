name: linux

on:
  push:
    branches-ignore: [main]   # main 的 push 由 release.yml 統一呼叫本 workflow
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - name: linux-arm64
            os: ubuntu-24.04-arm   # Qt 6.8.3 arm64 預編譯套件需要 glibc 2.38+（22.04 只有 2.35）
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ ninja-build cmake pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libpulse-dev libx11-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtspeech qtmultimedia
          cache: true

      - name: Configure
        shell: bash
        run: |
          set -eo pipefail
          # 失敗時把 CMake 的錯誤訊息輸出成註解（完整記錄需要登入才能看）
          exec > >(tee configure.log) 2>&1
          trap 'sleep 1; grep -E -B1 -A7 "CMake Error" configure.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:380}"; done' ERR
          cmake -S linux -B build-${{ matrix.name }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOMO_REQUIRE_TTS=ON -DCMAKE_CXX_COMPILER=g++

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-${{ matrix.name }} --config Release 2>&1 | tee build.log || { grep -E "error|undefined|FAILED" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; { echo "== moc 診斷"; "$QT_ROOT_DIR/libexec/moc" --version 2>&1 | head -3; ldd "$QT_ROOT_DIR/libexec/moc" 2>&1 | grep -iE "not found" | head -5; grep -iE -B6 "AutoMoc subprocess" build.log | head -14; } 2>&1 | while IFS= read -r l; do echo "::error::${l:0:380}"; done; exit 1; }

      - name: 打包 AppImage（內含 Qt，使用者不需安裝）
        shell: bash
        run: bash .github/scripts/build-appimage.sh "build-${{ matrix.name }}" "${{ matrix.name == 'linux-amd64' && 'x86_64' || 'aarch64' }}" dist-appimage

      - name: 啟動測試（無螢幕）
        continue-on-error: true   # 只提供資訊，不擋發佈
        shell: bash
        run: |
          chmod +x dist-appimage/*.AppImage
          code=0
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 6 dist-appimage/*.AppImage || code=$?
          echo "結束碼：$code（124 代表程式正常執行到逾時被終止）"
          [ "$code" -eq 124 ]

      - name: 打包 zip
        shell: bash
        run: |
          mkdir -p stage && cp dist-appimage/*.AppImage stage/
          python3 .github/scripts/package.py "dist/TomatoGuard-${{ matrix.name }}-CP${{ inputs.release_number || 'dev' }}.zip" stage

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.name }}
          path: dist/*.zip
